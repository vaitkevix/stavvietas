<style>

<script>
'use strict';
/* Lietotnes iestatījumi (build.py) */
const APP = {"svc": "stav", "mode": "interval", "name": "Pazemes stāvvietas", "acc": "sand", "unit": "m²", "qtyL": "Platība, m²", "qtyPh": "Piem. 2500", "doneL": "Nomazgāts", "doneBtn": "Nomazgāts", "lower": "mazgāšana", "weather": [], "wxL": "", "maxInt": 400, "notice": true, "veidiObj": false, "actL": "Mazgāt šo stāvvietu", "notePh": "Piem. vārtu pults pie apsardzes", "objHelp": "Grafikā nonāk stāvvietas ar m² > 0. Datumu grafiks liek ne agrāk kā pēc paziņošanas termiņa — atzīmējiet, kad iedzīvotāji paziņoti.", "whys": ["Auto nav izbraukuši", "Nav piekļuves", "Tehnika", "Nepaspēju"]};
const API = 'https://aizvietosana-api.vaitkevix.workers.dev/' + APP.svc, IMG = 'https://aizvietosana-api.vaitkevix.workers.dev/img?sz=w400&id=';
const SNOW = APP.mode === 'snow', PINK = 'shd_pin';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const S = { pin: ls.get(PINK) || '', tab: 'today', day: '', ym: '', month: null, q: '', grp: '', D: null, call: '' };
const ROLE = { admin: 'Administrators', vaditajs: 'Darbu vadītājs', izpilditajs: 'Izpildītājs', skatitajs: 'Skatītājs' };
const WD = ['P', 'O', 'T', 'C', 'Pk', 'S', 'Sv'], MON = ['janvāris', 'februāris', 'marts', 'aprīlis', 'maijs', 'jūnijs', 'jūlijs', 'augusts', 'septembris', 'oktobris', 'novembris', 'decembris'];
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dow = (d) => { const w = new Date(d + 'T12:00:00Z').getUTCDay(); return w === 0 ? 7 : w; };
const lvLong = (d) => { const x = new Date(d + 'T12:00:00Z'); return x.toLocaleDateString('lv-LV', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }); };
const lvS = (d) => d ? (+d.slice(8, 10)) + '.' + d.slice(5, 7) + '.' : '';
const nf = (n) => Math.round(+n || 0).toLocaleString('lv-LV');
const qf = (n) => nf(n) + ' ' + APP.unit;
const role = () => (S.D && S.D.me.role) || '';
const RW = { admin: 3, vaditajs: 2, izpilditajs: 1, skatitajs: 0 };
const can = (r) => (RW[role()] || 0) >= RW[r];
const active = (o) => o && o.aktivs != null && o.aktivs !== 0 && (SNOW || o.qty > 0);
const intOf = (o) => o.intervals || S.D.cfg.interval;
const wx = (d) => (S.D.wx || {})[d] || {};
const ICO = {
  rain: '<path d="M7 15a4 4 0 1 1 .9-7.9A5.5 5.5 0 0 1 18.5 9 3.5 3.5 0 0 1 17.5 15"/><path d="M9 18l-1 2M13 18l-1 2M17 18l-1 2"/>',
  snow: '<path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7"/>',
  bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>'
};
const ico = (k) => `<span class="dot"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]}</svg></span>`;

function toast(t, kind) { document.querySelectorAll('.toast').forEach(x => x.remove()); const el = document.createElement('div'); el.className = 'toast' + (kind === 'err' ? ' err' : ''); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 3200); }
async function api(action, data) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, pin: S.pin }, data || {})) });
  const j = await r.json().catch(() => ({ ok: false, error: 'Serveris neatbild' }));
  if (!j.ok) { const e = new Error(j.error || 'Kļūda'); e.code = j.code; throw e; }
  return j;
}
function sheet(html) { closeSheet(); const b = document.createElement('div'); b.className = 'sheet-bg'; b.id = 'sheetBg'; b.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  b.addEventListener('click', e => { if (e.target === b || e.target.closest('[data-x]')) closeSheet(); }); document.body.appendChild(b); return b.firstChild; }
function closeSheet() { const b = $('sheetBg'); if (b) b.remove(); }

/* ---------- ieeja ---------- */
function showGate(msg) { $('vApp').hidden = true; $('tabs').hidden = true; $('vGate').hidden = false; $('gErr').textContent = msg || ''; setTimeout(() => $('gPin').focus(), 100); }

  S.objBy = {}; r.objects.forEach(o => S.objBy[o.anorm] = o);
  if (SNOW && (!S.call || !r.calls.some(c => c.id === S.call))) { const c = r.calls.find(c => c.statuss === 'aktivs') || r.calls.find(c => c.statuss === 'gaida') || r.calls[0]; S.call = c ? c.id : ''; }
  $('vGate').hidden = true; $('vApp').hidden = false; $('tabs').hidden = false;
  $('hdSub').textContent = r.me.name + ' · ' + (ROLE[r.me.role] || r.me.role);

  if (!T.some(x => x[0] === S.tab)) S.tab = 'today';

/* Tēma kopīga ar SH portālu (sh_theme) */

/* ---------- Šodien (intervāla lietotnes) ---------- */
function noticeBy(x) { return APP.notice && S.D.cfg.noticeDays ? addDays(x.datums, -S.D.cfg.noticeDays) : ''; }

      const sub = x.statuss === 'done' ? `${qf(o.qty)} · ${esc(x.laiks)} · ${esc(x.izpilditajs)}` : `${qf(o.qty)}${x.brigade ? ' · ' + esc(x.brigade) : ''}${x.parcelts ? ' · pārcelts ' + x.parcelts + '×' + (x.iemesls ? ' (' + esc(x.iemesls.toLowerCase()) + ')' : '') : ''}${o.piekluve ? ' · piekļuve' : ''}`;

function shrink(file, max) {
  return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.82)); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Neizdevās nolasīt bildi')); }; img.src = u; });
}

      <div class="card ${APP.acc}"><span style="font-size:12.5px;font-weight:700;color:var(--ink2)">${esc(APP.doneL)}</span><b style="display:block;font-size:26px;font-weight:800">${done}</b></div>

  s.querySelector('#gSave').onclick = async (e) => { busy(e.target, '…');
    try { const act = $('gAct').checked, it = SNOW ? 0 : +$('gInt').value || S.D.cfg.interval, br = SNOW ? $('eBr').value.trim() : null;
      const r = await api('saveObj', { objs: objs.map((o, i) => ({ adrese: o.adrese, qty: SNOW ? 1 : o.qty || 0, intervals: it, seq: SNOW ? (o.seq || i + 1) : 0, brigade: br != null && br ? br : o.brigade || '', piezime: o.piezime || '', veidi: o.veidi || '', aktivs: act })) });
      closeSheet(); toast('Saglabāts ' + objs.length + (r.added ? ' · ieplānoti ' + r.added : '')); await load(); } catch (err) { toast(err.message, 'err'); unbusy(e.target); } };
}

/* ---------- Karte (OpenStreetMap) ---------- */
function leaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((res, rej) => { const c = document.createElement('link'); c.rel = 'stylesheet'; c.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(c);
    const j = document.createElement('script'); j.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; j.onload = res; j.onerror = () => rej(new Error('Karte neielādējās')); document.head.appendChild(j); });
}
async function drawMap(v) {
  const D = S.D, d = S.day; $('hdTitle').textContent = 'Karte';
  const day = SNOW ? D.visits.filter(x => x.izs === S.call) : D.visits.filter(x => x.datums === d), byA = {}; day.forEach(x => byA[x.anorm] = x);
  const objs = D.objects.filter(active), withC = objs.filter(o => o.lat), noC = objs.filter(o => o.lat == null).length;
  const seg = SNOW ? '' : `<div class="seg" style="margin:0 0 12px">${[0, 1, 2].map(i => addDays(D.today, i)).concat(D.visits.some(x => x.datums === d) && [0, 1, 2].every(i => addDays(D.today, i) !== d) ? [d] : []).map(x => `<button type="button" data-d="${x}" class="${x === d ? 'on' : ''}">${x === D.today ? 'Šodien' : x === addDays(D.today, 1) ? 'Rīt' : WD[dow(x) - 1] + ' ' + lvS(x)}</button>`).join('')}</div>`;
  v.innerHTML = `${seg}<div class="grid2"><div class="main"><div id="map" style="height:min(62vh,620px);border-radius:28px;overflow:hidden;background:var(--surf)"></div>
      <div class="legend"><span><i style="background:#3f7d5a;border-radius:50%"></i>${esc(APP.doneL)}</span><span><i style="background:#17201c;border-radius:50%"></i>${SNOW ? 'Maršrutā' : 'Ieplānots šai dienai'}</span><span><i style="background:#c98a00;border-radius:50%"></i>${SNOW ? 'Tīra tagad' : 'Pārcelts'}</span><span><i style="background:#b9c2bd;border-radius:50%"></i>Citi objekti</span></div></div>
      <div class="side"><div class="card" style="margin:0 0 8px"><b style="font-weight:800">${day.length} ${SNOW ? 'adreses izsaukumā' : 'izbraukumi · ' + qf(day.reduce((n, x) => n + (+((S.objBy[x.anorm] || {}).qty) || 0), 0))}</b>
        <p style="margin:4px 0 0;font-size:13px;font-weight:700;color:var(--ink2)">${withC.length} no ${objs.length} objektiem uz kartes${noC ? ' · ' + noC + ' vēl bez koordinātām' : ''}</p>
        ${noC && can('vaditajs') ? '<button class="pill dk" id="mGeo" style="margin-top:10px">Atrast koordinātas</button>' : ''}</div>
        <div class="list">${day.slice().sort((a, b) => SNOW ? String(a.brigade).localeCompare(String(b.brigade), 'lv') || a.seq - b.seq : 0).map((x, i) => `<button type="button" class="stop s-${x.statuss === 'done' ? 'done' : x.statuss === 'cant' ? 'cant' : x.prio || x.sakums ? 'moved' : 'plan'}" data-v="${x.id}"><span class="n">${i + 1}</span><span class="tx"><b>${esc(x.adrese)}</b><span>${SNOW ? esc(x.brigade || '—') : qf((S.objBy[x.anorm] || {}).qty)}</span></span></button>`).join('') || '<div class="card empty">Nav izbraukumu</div>'}</div></div></div>`;
  const sg = v.querySelector('.seg'); if (sg) sg.onclick = (e) => { const b = e.target.closest('[data-d]'); if (b) { S.day = b.dataset.d; drawMap(v); } };
  v.querySelector('.list').onclick = (e) => { const b = e.target.closest('[data-v]'); if (b) openVisit(b.dataset.v); };
  const g = $('mGeo'); if (g) g.onclick = async () => { busy(g, 'Meklē… (~15 s)'); try { const r = await api('geo'); toast('Atrastas ' + r.found + (r.left ? ' · vēl ' + r.left + ' — spiediet vēlreiz' : '')); await load(); } catch (err) { toast(err.message, 'err'); unbusy(g); } };
  try { await leaflet(); } catch (err) { $('map').innerHTML = `<div class="empty">${esc(err.message)}</div>`; return; }
  if (S.map) { S.map.remove(); S.map = null; }
  const m = S.map = L.map('map', { zoomControl: true, attributionControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
  const pts = [];
  withC.forEach(o => { const x = byA[o.anorm], col = !x ? '#b9c2bd' : x.statuss === 'done' ? '#3f7d5a' : x.prio || x.sakums ? '#c98a00' : '#17201c';
    const mk = L.circleMarker([o.lat, o.lng], { radius: x ? 9 : 6, color: '#fff', weight: 2, fillColor: col, fillOpacity: 1 }).addTo(m);
    mk.bindTooltip(o.adrese + (x && x.brigade ? ' · ' + x.brigade : ''));
    mk.on('click', () => x ? openVisit(x.id) : objCard(o)); if (x) pts.push([o.lat, o.lng]); });
  const all = pts.length ? pts : withC.map(o => [o.lat, o.lng]);
  if (all.length) m.fitBounds(all, { padding: [30, 30], maxZoom: 15 }); else m.setView([56.95, 24.11], 11);
}

/* ---------- Noteikumi ---------- */
function drawRules(v) {
  const C = S.D.cfg; $('hdTitle').textContent = 'Noteikumi';
  const fld = (id, l, val, attrs) => `<div class="f"><label for="${id}">${l}</label><input id="${id}" value="${esc(val)}" ${attrs || 'type="number"'}></div>`;
  const veidi = `<div class="card f"><span class="lb">Darbu saraksts (atzīmē pēc darba, ar komatu)</span><input id="cV" value="${esc((C.veidi || []).join(', '))}" style="width:100%;height:48px;border:0;border-radius:16px;background:var(--surf2);padding:0 16px;font-size:16px;font-weight:700"></div>`;
  const main = SNOW ? `<div class="card sky" style="margin:0 0 12px"><b style="font-size:15px;font-weight:800">Ik 3 stundas sistēma pārbauda sniega prognozi</b>
      <p style="margin:4px 0 0;font-size:13px;font-weight:700;color:var(--ink2)">Ja šodien vai rīt prognozē ≥ slieksni, izveidojas izsaukums. Ar apstiprināšanu — vadītājs to apstiprina vai atceļ; bez — traktoristi maršrutus saņem uzreiz. Vadītājs var izsaukt arī ar pogu.</p></div>
      <div class="card f"><span class="lb">Sniegs</span><div class="row2">${fld('cSn', 'Izsaukt, ja sniegs ≥ (cm/dienā)', C.snowCm, 'type="number" step="0.5" min="0.5"')}</div></div>
      <div class="card f checks"><label><input type="checkbox" id="cAu" ${C.auto ? 'checked' : ''}> Veidot izsaukumu pēc prognozes</label><label><input type="checkbox" id="cAp" ${C.approve ? 'checked' : ''}> Vadītājam jāapstiprina</label><label><input type="checkbox" id="cPh" ${C.photoReq ? 'checked' : ''}> Bilde pēc tīrīšanas obligāta</label></div>`
    : `<div class="card sky" style="margin:0 0 12px"><b style="font-size:15px;font-weight:800">Katru rītu 05:00 grafiks sakārtojas pats</b>
      <p style="margin:4px 0 0;font-size:13px;font-weight:700;color:var(--ink2)">1) objekti, kam pienācis intervāls · 2) nepaspētie — pirmie · ${APP.weather.length ? '3) ' + esc(APP.wxL) + ' dienas izlaistas · ' : ''}4) dienā ne vairāk par slodzi · 5) brīvdienas izlaistas${APP.notice ? ' · 6) ne agrāk kā pēc paziņošanas termiņa' : ''}.</p></div>
      ${APP.weather.indexOf('rain') !== -1 ? `<div class="card f"><span class="lb">Lietus</span><div class="row2">${fld('cR', 'Pārcelt, ja lietus ≥ (mm)', C.rainMm, 'type="number" step="0.5" min="0"')}${fld('cW', 'Vēl dienas pēc lietus', C.wetDays, 'type="number" min="0" max="3"')}</div></div>` : ''}
      ${APP.weather.indexOf('frost') !== -1 ? `<div class="card f"><span class="lb">Sals</span><div class="row2">${fld('cF', 'Nestrādāt, ja t° min zem (°C)', C.frostC, 'type="number" step="1"')}</div></div>` : ''}
      ${APP.notice ? `<div class="card f"><span class="lb">Iedzīvotāju paziņošana</span><div class="row2">${fld('cN', 'Paziņot dienas iepriekš', C.noticeDays, 'type="number" min="0" max="30"')}</div></div>` : ''}
      <div class="card f"><span class="lb">Slodze un intervāls</span><div class="row2">${fld('cM', 'Maks. ' + esc(APP.unit) + ' dienā', C.maxQty, 'type="number" min="1"')}${fld('cI', 'Intervāls pēc noklusējuma (dienas)', C.interval, 'type="number" min="1" max="' + APP.maxInt + '"')}</div></div>
      <div class="card f"><span class="lb">Sezona un darba dienas</span><div class="row2">${fld('cS1', 'No (MM-DD)', C.season[0], '')}${fld('cS2', 'Līdz (MM-DD)', C.season[1], '')}</div>
        <div class="chips" id="cWd">${WD.map((w, i) => `<button type="button" data-w="${i + 1}" class="${C.workdays.indexOf(i + 1) !== -1 ? 'on' : ''}">${w}</button>`).join('')}</div></div>
      <div class="card f checks"><label><input type="checkbox" id="cPh" ${C.photoReq ? 'checked' : ''}> Bilde pēc darba obligāta</label></div>`;
  const wxs = Object.keys(S.D.wx || {}).sort();
  v.innerHTML = `<div class="grid2"><div class="main">${main}${veidi}<button class="pill dk big" id="cSave" style="width:100%">Saglabāt${SNOW ? '' : ' un pārplānot'}</button></div>
    <div class="side"><div class="card"><b style="font-weight:800">Prognoze (Rīga)</b><div class="log" style="margin-top:8px">${wxs.map(d => { const w = wx(d); return `<div><b>${WD[dow(d) - 1]} ${lvS(d)} · ${(+w.r || 0).toFixed(1)} mm${w.s ? ' · sniegs ' + (+w.s).toFixed(1) + ' cm' : ''}${w.t != null ? ' · ' + Math.round(w.t) + ' °C' : ''}</b></div>`; }).join('') || '<div><span>Prognoze tiks ielādēta drīzumā</span></div>'}</div></div></div></div>`;
  const wd = $('cWd'); if (wd) wd.onclick = (e) => { const b = e.target.closest('[data-w]'); if (b) b.classList.toggle('on'); };
  $('cSave').onclick = async (e) => { busy(e.target, '…');
    const val = (id) => { const el = $(id); return el ? el.value.trim() : undefined; }, chk = (id) => { const el = $(id); return el ? el.checked : undefined; };
    try { const cfg = { rainMm: val('cR'), wetDays: val('cW'), frostC: val('cF'), noticeDays: val('cN'), maxQty: val('cM'), interval: val('cI'), snowCm: val('cSn'), photoReq: chk('cPh'), auto: chk('cAu'), approve: chk('cAp'),
        veidi: val('cV').split(',').map(x => x.trim()).filter(Boolean) };
      if (!SNOW) { cfg.season = [val('cS1'), val('cS2')]; cfg.workdays = [...wd.querySelectorAll('.on')].map(b => +b.dataset.w); }
      const r = await api('saveCfg', { cfg }); toast('Saglabāts' + (SNOW ? '' : ' · +' + r.added + ' jauni, ' + r.moved + ' pārcelti')); await load(); } catch (err) { toast(err.message, 'err'); } finally { unbusy(e.target); } };
}

/* ---------- start ---------- */
(function () { applyTheme(ls.get('sh_theme'));
  const h = location.hash.slice(1); if (h && ['today', 'month', 'objs', 'rules', 'map'].indexOf(h) !== -1) S.tab = h;
  if (!S.pin) return showGate('');
  load().catch(err => { if (err.code === 'auth') { ls.del(PINK); S.pin = ''; showGate('PIN vairs nederīgs vai nav piekļuves'); } else { showGate(err.message); } });
})();
</script>
</body>
</html>
