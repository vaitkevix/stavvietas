<style>
:root{--r-base:14px;--r-xs:calc(var(--r-base)*.5);--r-sm:calc(var(--r-base)*.72);--r-md:var(--r-base);--r-lg:calc(var(--r-base)*1.43);--r-xl:calc(var(--r-base)*2);--r-pill:999px}/*SH rādiusi: maini --r-base*/

:root{--bg:#f1f4f2;--surf:#fff;--surf2:#f3f5f4;--ink:#17201c;--ink2:#4a534f;--ink3:#6d7672;--dark:#17201c;--ondark:#fff;
  --mint:#d6e8e1;--sand:#f4e4b4;--sky:#d8e6f2;--rose:#f5dbe3;--lilac:#e2ddf2;--peach:#f8dcc6;--ok:#2f5d45;--warn:#6b4a00;--bad:#8a2a3b}
:root[data-theme="dark"]{--bg:#0b120f;--surf:#151d1a;--surf2:#1b2521;--ink:#eef2ef;--ink2:#b4bdb8;--ink3:#8b958f;--dark:#eef2ef;--ondark:#0b120f;
  --mint:#1e3a32;--sand:#3d3520;--sky:#1e2f3d;--rose:#3d2530;--lilac:#2c2840;--peach:#40291b;--ok:#8fd1ad;--warn:#f0c46b;--bad:#f3a0b0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.top .t{flex:1;min-width:0}
.top small{display:block;font-size:13px;font-weight:700;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .lg{width:44px;height:44px;border-radius:var(--r-md,14px);background:var(--mint);color:var(--ink);display:grid;place-items:center;flex:none}
.top .bn{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(17px,4.6vw,20px);font-weight:800;letter-spacing:-.03em;line-height:1.15}
.pt{margin:0 0 14px;font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--surf);display:grid;place-items:center;flex:none;color:var(--ink)}
.ib.dk{background:var(--dark);color:var(--ondark)}
.card{border-radius:var(--r-xl,28px);background:var(--surf);padding:16px 18px}
.mint{background:var(--mint)}.sand{background:var(--sand)}.sky{background:var(--sky)}.rose{background:var(--rose)}.lilac{background:var(--lilac)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px}
.sec h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border:0;border-radius:var(--r-pill,999px);background:var(--surf);font-size:14px;font-weight:800;text-decoration:none;color:var(--ink);white-space:nowrap}
.pill.dk{background:var(--dark);color:var(--ondark)}
.pill.big{min-height:56px;padding:0 22px;font-size:16px}
.seg{display:flex;gap:6px;padding:6px;border-radius:var(--r-pill,999px);background:var(--surf);overflow-x:auto;scrollbar-width:none}

.seg button{min-height:40px;padding:0 16px;border:0;border-radius:var(--r-pill,999px);background:transparent;font-size:14px;font-weight:800;white-space:nowrap}
.seg button.on{background:var(--dark);color:var(--ondark)}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-xl,28px);margin:0 0 12px}
.banner b{display:block;font-size:14px;font-weight:800}.banner div>span{display:block;font-size:12.5px;font-weight:700;color:var(--ink2)}
.banner .dot{display:grid;place-items:center;color:var(--ink)}
.dot{width:40px;height:40px;border-radius:50%;background:var(--surf);display:grid;place-items:center;flex:none}
.prog .row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink2)}
.prog .big{display:flex;align-items:baseline;gap:6px;margin-top:4px}.prog .big b{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}.prog .big span{font-size:16px;font-weight:800;color:var(--ink2)}
.bar{height:8px;border-radius:var(--r-pill,999px);background:rgba(23,32,28,.15);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;border-radius:var(--r-pill,999px);background:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.stop{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-xl,28px);background:var(--surf);border:0;width:100%;text-align:left}
.stop .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:14px;font-weight:800;background:var(--surf2)}

.chip{flex:none;font-size:12px;font-weight:800;padding:6px 10px;border-radius:var(--r-pill,999px);background:var(--surf2)}
.chip.wrap{flex:1 1 100%;white-space:normal;border-radius:var(--r-md,14px);line-height:1.4}
.s-done .n{background:var(--mint)}.s-done .chip{color:var(--ok)}
.s-moved{background:var(--sand)}.s-moved .n,.s-moved .chip{background:var(--surf)}.s-moved .chip{color:var(--warn)}
.s-cant .n{background:var(--rose)}.s-cant .chip{color:var(--bad)}
.empty{padding:28px 18px;text-align:center;font-weight:700;color:var(--ink3)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;width:min(560px,calc(100% - 32px));display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:6px;border-radius:var(--r-pill,999px);background:var(--surf);box-shadow:0 8px 28px -12px rgba(16,32,26,.4)}

/* kalendārs */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:12px;font-weight:800;color:var(--ink3);text-align:center;padding:4px 0}
.cal .d{min-height:84px;border-radius:var(--r-lg,20px);padding:8px;border:0;text-align:left;display:flex;flex-direction:column;gap:2px;background:var(--surf2)}
.cal .d b{font-size:15px;font-weight:800}.cal .d span{font-size:12px;font-weight:800}.cal .d small{font-size:11px;font-weight:700;color:var(--ink2)}
.cal .d.we{background:transparent;opacity:.55}.cal .d.blank{visibility:hidden}
.cal .d.done{background:var(--mint)}.cal .d.rain{background:var(--sky)}.cal .d.got{background:var(--sand)}
.cal .d.today{outline:2px solid var(--ink);outline-offset:-2px}.cal .d.sel{outline:2px dashed var(--ink);outline-offset:-2px}
@media(max-width:560px){.cal .d{min-height:58px;padding:6px}.cal .d small{display:none}.cal .d span{font-size:11px}}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.grid2{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}.grid2>.main{flex:999 1 560px;min-width:0}.grid2>.side{flex:1 1 300px;min-width:0}
.log{display:flex;flex-direction:column;gap:8px}.log div{padding:10px 12px;border-radius:var(--r-lg,20px);background:var(--surf)}
.log b{display:block;font-size:13.5px;font-weight:800}.log span{font-size:12px;font-weight:700;color:var(--ink2)}
/* objekti */
.search{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.search input{flex:1 1 220px;height:48px;border:0;border-radius:var(--r-pill,999px);background:var(--surf);padding:0 18px;font-size:16px;font-weight:700;min-width:0}
.obj{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-lg,20px);background:var(--surf);border:0;width:100%;text-align:left}
.obj .tx{flex:1;min-width:0}.obj b{display:block;font-size:14.5px;font-weight:800}.obj span{font-size:12.5px;font-weight:700;color:var(--ink2)}
.obj.off{opacity:.6}
/* lapas */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(8,20,16,.45);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet-bg{align-items:center}}
.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:var(--r-xl,28px) var(--r-xl,28px) 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{border-radius:var(--r-xl,28px)}}
.sheet .hd{display:flex;align-items:center;gap:10px;margin:0 0 14px}.sheet .hd h3{margin:0;flex:1;font-size:20px;font-weight:800;letter-spacing:-.02em}
.f{margin:0 0 12px}.f label,.f .lb{display:block;font-size:13px;font-weight:800;color:var(--ink2);margin:0 0 6px 4px}
.f input,.f select,.f textarea{width:100%;height:48px;border:0;border-radius:var(--r-lg,20px);background:var(--surf);padding:0 16px;font-size:16px;font-weight:700}
.f textarea{height:auto;min-height:80px;padding:12px 16px}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.photos .ph{aspect-ratio:1;border-radius:var(--r-lg,20px);background:var(--surf) center/cover no-repeat;position:relative}
.photos .add{aspect-ratio:1;border-radius:var(--r-lg,20px);border:2px dashed #c9d3ce;background:var(--surf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:800}
.photos .ph button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff}
.checks{border-radius:var(--r-xl,28px);background:var(--surf);padding:4px}
.checks label{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;font-size:15px;font-weight:700}
.checks input{width:22px;height:22px;accent-color:var(--ink);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{min-height:44px;padding:0 14px;border:0;border-radius:var(--r-pill,999px);background:var(--surf);font-size:13.5px;font-weight:800}
.chips button.on{background:var(--dark);color:var(--ondark)}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px;margin-top:14px}
.acts button{min-height:56px;border:0;border-radius:var(--r-pill,999px);font-size:16px;font-weight:800}
.btn-dk{background:var(--dark);color:var(--ondark)}.btn-rose{background:var(--rose)}.btn-lt{background:var(--surf)}
.thr .thrL{display:grid;gap:8px;margin:0 0 8px}.thrM{background:var(--surf);border-radius:var(--r-lg,20px);padding:10px 14px;font-weight:700;font-size:14px;overflow-wrap:anywhere}.thrM.v{background:var(--sky)}.thrM small{display:block;font-size:12px;color:var(--ink2);font-weight:800}
.thrF{display:flex;gap:8px;align-items:center}.thrF input{flex:1;min-width:0;height:48px;border:0;border-radius:var(--r-lg,20px);background:var(--surf);padding:0 14px;font-size:16px;font-weight:700}.mut{font-weight:700;color:var(--ink3)}
.thumbs{display:flex;gap:6px;margin-top:6px}.thumbs img{width:56px;height:56px;border-radius:var(--r-md,14px);object-fit:cover;background:var(--surf2)}
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
.gate .card{width:min(380px,100%);text-align:center;padding:28px 22px}
.gate input{width:100%;height:56px;border:0;border-radius:var(--r-lg,20px);background:var(--surf2);text-align:center;font-size:22px;font-weight:800;margin:14px 0 10px}
.gate input::placeholder{font-size:16px;font-weight:700;color:var(--ink3)}
.gate .err{min-height:20px;color:var(--bad);font-weight:700;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;max-width:calc(100% - 32px);padding:12px 18px;border-radius:var(--r-pill,999px);background:var(--dark);color:var(--ondark);font-weight:800;font-size:14px}

.skel{height:64px;border-radius:var(--r-xl,28px);background:var(--surf);opacity:.6;margin-bottom:8px}
.copy{text-align:center;font-size:11px;font-weight:700;color:var(--ink3);margin:24px 0 0}
.clm{margin-top:12px}.clmc{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;border:0;font:inherit;cursor:pointer;margin:0 0 8px}.clmc b{font-weight:800}.clmc span{font-weight:700;overflow-wrap:anywhere;white-space:pre-wrap}.clmc small{font-size:12.5px;font-weight:700;color:var(--ink3)}
.clmc.open{background:var(--rose);color:var(--ink)}.clmc.open b{color:var(--bad)}.clmc.fixed{background:var(--mint);color:var(--ink)}.clmc.fixed b{color:var(--ok)}
.clmb{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;font:inherit;cursor:pointer;margin:0 0 12px;background:var(--rose);color:var(--ink);min-height:56px}.clmb b{color:var(--bad);font-weight:800}.clmb span{font-size:13.5px;font-weight:700;overflow-wrap:anywhere}
</style>

<body>
<section class="gate" id="vGate" hidden>

    <input id="gPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN">
    <div class="err" id="gErr"></div>
    <button type="button" class="gpw" id="gAbc" onclick="var i=document.getElementById('gPin');i.inputMode=i.inputMode==='text'?'numeric':'text';this.textContent=i.inputMode==='text'?'PIN ar cipariem':'Parole ar burtiem (SIA)';i.focus()">Parole ar burtiem (SIA)</button>
    <button class="pill dk big" style="width:100%" type="submit">Ienākt</button>
    <p class="copy">© VAITKEVIX, SIA</p>
  </form>
</section>

  <header class="top">

    <div class="t"><b class="bn">Pazemes stāvvietas</b><small id="hdSub">Mazgāšana · tīrīšana</small></div>
    <button class="ib" id="btnHelp" aria-label="Palīdzība un pamācība" title="Palīdzība un pamācība"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01"/></svg></button>
    <button class="ib" id="btnTheme" aria-label="Tumšais režīms"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    <button class="ib" id="btnRefresh" aria-label="Atjaunot"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="ib dk" id="btnMe" aria-label="Profils">··</button>
  </header>
  <div class="ptrow"><h1 class="pt" id="hdTitle">Šodien</h1><button type="button" class="pill lgb" id="btnLang" aria-label="Русский язык">RU</button></div>

/* ---------- Karte (OpenStreetMap) ---------- */
function leaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((res, rej) => { const c = document.createElement('link'); c.rel = 'stylesheet'; c.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(c);
    const j = document.createElement('script'); j.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; j.onload = res; j.onerror = () => rej(new Error('Karte neielādējās')); document.head.appendChild(j); });
}
async function drawMap(v) {
  const D = S.D, d = S.day; $('hdTitle').textContent = 'Karte';
  const day = SNOW ? D.visits.filter(x => x.izs === S.call) : D.visits.filter(x => x.datums === d), byA = {}; day.forEach(x => byA[x.anorm] = x);
  const objs = D.objects.filter(active), withC = objs.filter(o => o.lat), noC = objs.filter(o => o.lat == null).length;
  const seg = SNOW ? '' : `<div class="seg" style="margin:0 0 12px">${[0, 1, 2].map(i => addDays(D.today, i)).concat(D.visits.some(x => x.datums === d) && [0, 1, 2].every(i => addDays(D.today, i) !== d) ? [d] : []).map(x => `<button type="button" data-d="${x}" class="${x === d ? 'on' : ''}">${x === D.today ? 'Šodien' : x === addDays(D.today, 1) ? 'Rīt' : WD[dow(x) - 1] + ' ' + lvS(x)}</button>`).join('')}</div>`;
  v.innerHTML = `${seg}<div class="grid2"><div class="main"><div id="map" style="height:min(62vh,620px);border-radius:var(--r-xl,28px);overflow:hidden;background:var(--surf)"></div>
      <div class="legend"><span><i style="background:#3f7d5a;border-radius:50%"></i>${esc(APP.doneL)}</span><span><i style="background:#17201c;border-radius:50%"></i>${SNOW ? 'Maršrutā' : 'Ieplānots šai dienai'}</span><span><i style="background:#c98a00;border-radius:50%"></i>${SNOW ? 'Tīra tagad' : 'Pārcelts'}</span><span><i style="background:#b9c2bd;border-radius:50%"></i>Citi objekti</span></div></div>
      <div class="side"><div class="card" style="margin:0 0 8px"><b style="font-weight:800">${day.length} ${SNOW ? 'adreses izsaukumā' : 'izbraukumi · ' + qf(day.reduce((n, x) => n + (+((S.objBy[x.anorm] || {}).qty) || 0), 0))}</b>
        <p style="margin:4px 0 0;font-size:13px;font-weight:700;color:var(--ink2)">${withC.length} no ${objs.length} objektiem uz kartes${noC ? ' · ' + noC + ' vēl bez koordinātām' : ''}</p>
        ${noC && can('vaditajs') ? '<button class="pill dk" id="mGeo" style="margin-top:10px">Atrast koordinātas</button>' : ''}</div>
        <div class="list">${day.slice().sort((a, b) => SNOW ? String(a.brigade).localeCompare(String(b.brigade), 'lv') || a.seq - b.seq : 0).map((x, i) => `<button type="button" class="stop s-${x.statuss === 'done' ? 'done' : x.statuss === 'cant' ? 'cant' : x.prio || x.sakums ? 'moved' : 'plan'}" data-v="${x.id}"><span class="n">${i + 1}</span><span class="tx"><b>${esc(x.adrese)}</b><span>${SNOW ? esc(x.brigade || '—') : qf((S.objBy[x.anorm] || {}).qty)}</span></span></button>`).join('') || '<div class="card empty">Nav izbraukumu</div>'}</div></div></div>`;
  const sg = v.querySelector('.seg'); if (sg) sg.onclick = (e) => { const b = e.target.closest('[data-d]'); if (b) { S.day = b.dataset.d; drawMap(v); } };
  v.querySelector('.list').onclick = (e) => { const b = e.target.closest('[data-v]'); if (b) openVisit(b.dataset.v); };
  const g = $('mGeo'); if (g) g.onclick = async () => { busy(g, 'Meklē… (~15 s)'); try { const r = await api('geo'); toast('Atrastas ' + r.found + (r.left ? ' · vēl ' + r.left + ' — spiediet vēlreiz' : '')); await load(); } catch (err) { toast(err.message, 'err'); unbusy(g); } };
  try { await leaflet(); } catch (err) { $('map').innerHTML = `<div class="empty">${esc(err.message)}</div>`; return; }
  if (S.map) { S.map.remove(); S.map = null; }
  const m = S.map = L.map('map', { zoomControl: true, attributionControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
  const pts = [];
  withC.forEach(o => { const x = byA[o.anorm], col = !x ? '#b9c2bd' : x.statuss === 'done' ? '#3f7d5a' : x.prio || x.sakums ? '#c98a00' : '#17201c';
    const mk = L.circleMarker([o.lat, o.lng], { radius: x ? 9 : 6, color: '#fff', weight: 2, fillColor: col, fillOpacity: 1 }).addTo(m);
    mk.bindTooltip(o.adrese + (x && x.brigade ? ' · ' + x.brigade : ''));
    mk.on('click', () => x ? openVisit(x.id) : objCard(o)); if (x) pts.push([o.lat, o.lng]); });
  const all = pts.length ? pts : withC.map(o => [o.lat, o.lng]);
  if (all.length) m.fitBounds(all, { padding: [30, 30], maxZoom: 15 }); else m.setView([56.95, 24.11], 11);
}

      ${APP.weather.indexOf('rain') !== -1 ? `<div class="card f"><span class="lb">Lietus</span><div class="row2">${fld('cR', 'Pārcelt, ja lietus ≥ (mm)', C.rainMm, 'type="number" step="0.5" min="0"')}${fld('cW', 'Vēl dienas pēc lietus', C.wetDays, 'type="number" min="0" max="3"')}</div></div>` : ''}
      ${APP.weather.indexOf('frost') !== -1 ? `<div class="card f"><span class="lb">Sals</span><div class="row2">${fld('cF', 'Nestrādāt, ja t° min zem (°C)', C.frostC, 'type="number" step="1"')}</div></div>` : ''}
      ${APP.notice ? `<div class="card f"><span class="lb">Iedzīvotāju paziņošana</span><div class="row2">${fld('cN', 'Paziņot dienas iepriekš', C.noticeDays, 'type="number" min="0" max="30"')}${fld('cRp', 'Neizbraukušās — atkārtot pēc (d.)', C.repeatDays || 7, 'type="number" min="1" max="60"')}</div><p style="margin:0;font-size:13px;font-weight:700;color:var(--ink2)">Pārvaldniekam (Mājas lieta → pārvaldnieks, e-pasts Administrēšanā) e-pasts aiziet paziņošanas dienā un katru reizi, kad datums tiek pārcelts. Mājas lapā datums redzams automātiski.</p></div>` : ''}

    else showGate(err.message); });
  first().then(() => flushQ()).catch(() => 0);
